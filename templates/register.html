{% extends "base.html" %}

{% block title %}Register Account – Sweet Scoop{% endblock %}

{% block content %}
<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5">
                <div class="card border-0 shadow-lg rounded-4 p-4">
                    <div class="text-center mb-4">
                        <div style="font-size: 3rem;">🍨</div>
                        <h3 class="fw-bold">Join Sweet Scoop Family</h3>
                        <p class="text-muted">Create an account for quick orders & track history</p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Your Full Name</label>
                            <input type="text" name="username" id="username" class="form-control" placeholder="e.g. Sarah Jenkins" required>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">Email Address</label>
                            <input type="email" name="email" id="email" class="form-control" placeholder="name@example.com" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">Password</label>
                            <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <div class="mb-4">
                            <label for="confirm_password" class="form-label fw-semibold">Confirm Password</label>
                            <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btn btn-primary-custom btn-lg w-100 py-3 mb-3">
                            Create Account 🚀
                        </button>
                    </form>

                    <div class="text-center mt-3 text-muted small">
                        Already have an account? <a href="{{ url_for('login') }}" class="text-danger fw-bold">Sign In</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
